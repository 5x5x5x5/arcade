<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Puppy Chase 3D</title>
<meta name="description" content="Be the cat. Round up the runaway pups in a sunny 3D park.">
<meta name="theme-color" content="#8ED4F0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Puppy Chase">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
  :root{
    --sky1:#8ED4F0; --sky2:#C8ECF7;
    --taxi:#FFC93C; --syrup:#6B3F17;
    --cream:#FFF6E5; --coral:#FF7B54;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:'Nunito',sans-serif; background:var(--sky1);
    overflow:hidden; touch-action:none;
    user-select:none; -webkit-user-select:none;
  }
  #game{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  .hud{
    position:fixed; top:0; left:0; right:0; z-index:2;
    display:flex; align-items:center; justify-content:center; gap:12px;
    padding:12px 10px 0;
    padding-top:calc(12px + env(safe-area-inset-top));
    pointer-events:none;
  }
  h1{
    font-family:'Fredoka',sans-serif; font-weight:700;
    color:var(--syrup); font-size:clamp(1.1rem, 5vw, 1.6rem);
    text-shadow:0 2px 0 #fff8; letter-spacing:.5px;
  }
  .score-badge{
    background:var(--taxi); color:var(--syrup);
    font-family:'Fredoka',sans-serif; font-weight:600;
    font-size:1.1rem; padding:5px 16px; border-radius:14px;
    border:3px solid var(--syrup); box-shadow:0 3px 0 var(--syrup);
    min-width:88px; text-align:center;
  }
  .sound-btn{
    background:var(--cream); border:3px solid var(--syrup);
    border-radius:12px; font-size:1.05rem; padding:3px 9px;
    box-shadow:0 3px 0 var(--syrup); cursor:pointer; pointer-events:auto;
  }
  .sound-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--syrup); }
  .sound-btn:focus-visible{ outline:3px solid var(--coral); outline-offset:2px; }
  .home-btn{
    position:fixed; left:10px; top:12px; z-index:3;
    top:calc(12px + env(safe-area-inset-top));
    background:var(--cream); border:3px solid var(--syrup);
    border-radius:12px; font-size:1.05rem; padding:3px 9px;
    box-shadow:0 3px 0 var(--syrup); text-decoration:none;
  }
  #toast{
    position:fixed; left:50%; top:34%; z-index:4;
    transform:translate(-50%,-50%) scale(0);
    font-family:'Fredoka',sans-serif; font-weight:700;
    font-size:clamp(1.5rem, 6.5vw, 2.4rem);
    color:#fff; background:var(--coral);
    padding:10px 26px; border-radius:20px;
    border:4px solid var(--syrup); box-shadow:0 5px 0 var(--syrup);
    pointer-events:none; white-space:nowrap;
    transition:transform .25s cubic-bezier(.34,1.6,.64,1);
    rotate:-4deg;
  }
  #toast.show{ transform:translate(-50%,-50%) scale(1); }
  #intro{
    position:fixed; inset:0; z-index:5;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:#0003; text-align:center; padding:20px;
  }
  #intro .bubble{
    background:var(--cream); border:4px solid var(--syrup); border-radius:20px;
    box-shadow:0 6px 0 var(--syrup); padding:22px 28px; max-width:420px;
  }
  #intro .big{ font-size:2.6rem; }
  #intro p{
    font-family:'Fredoka',sans-serif; color:var(--syrup);
    font-weight:600; font-size:1.15rem; margin-top:8px;
  }
  #intro small{ display:block; margin-top:8px; color:var(--syrup); opacity:.7; font-weight:800; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<a class="home-btn" href="../" aria-label="Back to the arcade">🕹️</a>
<div class="hud">
  <h1>Puppy Chase <span aria-hidden="true">🐾</span></h1>
  <div class="score-badge" id="score">🦴 0</div>
  <button class="sound-btn" id="sound" aria-label="Toggle sound">🔊</button>
</div>
<div id="toast" role="status"></div>

<div id="intro">
  <div class="bubble">
    <div class="big">🐱💨🐶</div>
    <p>Be the cat! Chase down the runaway pups.</p>
    <small>Drag anywhere (or arrow keys / WASD) to run.<br>Tap to start!</small>
  </div>
</div>

<script>
'use strict';
/* ---------- tuning knobs ---------- */
const CAT_SPEED   = 7.0;   // world units / s
const DOG_WANDER  = 2.2;
const DOG_FLEE    = 5.2;   // slower than the cat, so pups are catchable
const FLEE_RADIUS = 9;     // pups bolt when the cat gets this close
const CATCH_RADIUS= 1.4;
const START_DOGS  = 3;
const MAX_DOGS    = 6;     // +1 pup every 5 catches, up to this
const PARK        = 42;    // half-size of the park

// platforms without a color emoji font (some desktops) draw the whole cast as
// faint monochrome outlines — detect that and swap in the Noto Color Emoji webfont
let EMOJI_FONT = 'sans-serif';
(function(){
  try{
    const c = document.createElement('canvas'); c.width = c.height = 24;
    const g = c.getContext('2d');
    g.font = '20px sans-serif'; g.textBaseline = 'top'; g.fillText('🐶', 0, 0);
    const d = g.getImageData(0,0,24,24).data;
    let color = false;
    for(let i=0;i<d.length;i+=4){
      if(d[i+3]>16 && (Math.abs(d[i]-d[i+1])>16 || Math.abs(d[i+1]-d[i+2])>16)){ color=true; break; }
    }
    if(!color && document.fonts)
      document.fonts.load("20px 'Noto Color Emoji'").then(()=>{ EMOJI_FONT = "'Noto Color Emoji', sans-serif"; });
  }catch(e){}
})();

const cv = document.getElementById('game');
const cx2d = cv.getContext('2d');
let W=0, H=0, DPR=1, HORIZON=0, FOCAL=0;
function resize(){
  DPR = Math.min(devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cx2d.setTransform(DPR,0,0,DPR,0,0);
  HORIZON = H*0.32;
  // wide enough to see the park, small enough that the cat (at relz=CAM_BACK)
  // always projects above the bottom edge on any aspect ratio
  FOCAL = Math.min(H*0.80, W*0.95);
}
addEventListener('resize', resize); resize();

/* ---------- world ---------- */
const CAM_BACK = 9, CAM_H = 5;
const cat = {x:0, z:0, vx:0, vz:0, emoji:'🐱', size:1.6, bob:0};
const cam = {x:0, z:-CAM_BACK};
let yaw = 0;   // camera heading; 0 faces +z, swings behind the cat as it runs
const dogs = [];
const props = [];
const DOG_EMOJI = ['🐶','🐕','🐩','🦮'];
let score = 0, milestone = 0;

function rnd(a,b){ return a + Math.random()*(b-a); }
function spawnDog(){
  // drop the pup on a ring around the cat, clamped inside the park
  const ang = rnd(0, Math.PI*2), d = rnd(14, 24);
  dogs.push({
    x: Math.max(-PARK, Math.min(PARK, cat.x + Math.cos(ang)*d)),
    z: Math.max(-PARK, Math.min(PARK, cat.z + Math.sin(ang)*d)),
    vx:0, vz:0, emoji: DOG_EMOJI[dogs.length % DOG_EMOJI.length],
    size:1.6, bob:rnd(0,6), turn:rnd(0.5,1.5), wang:rnd(0,Math.PI*2)
  });
}
for(let i=0;i<START_DOGS;i++) spawnDog();

// scenery billboards — trees ring the fence line, flowers dot the lawn
for(let i=0;i<46;i++){
  const side = i%4, t = rnd(-PARK,PARK), edge = PARK + rnd(0.5,4);
  props.push({
    x: side<2 ? t : (side===2?-edge:edge),
    z: side<2 ? (side===0?-edge:edge) : t,
    emoji: Math.random()<0.75?'🌳':'🌲', size:rnd(2.6,3.6)
  });
}
// a sparse outer grove so the horizon isn't empty when the camera faces outward
for(let i=0;i<24;i++){
  const ang = rnd(0,Math.PI*2), d = PARK + rnd(6,20);
  props.push({ x:Math.cos(ang)*d, z:Math.sin(ang)*d, emoji:'🌳', size:rnd(2.4,3.4) });
}
for(let i=0;i<60;i++){
  props.push({ x:rnd(-PARK,PARK), z:rnd(-PARK,PARK),
    emoji:['🌼','🌷','🍄','🌿','🌱','🪨'][i%6], size:rnd(0.5,0.8) });
}
const clouds=[]; for(let i=0;i<5;i++) clouds.push({x:rnd(0,1), y:rnd(0.03,0.22), s:rnd(28,52), v:rnd(2,6)});

/* ---------- input ---------- */
const keys = {};
addEventListener('keydown', e=>{ keys[e.key.toLowerCase()]=1; });
addEventListener('keyup',   e=>{ keys[e.key.toLowerCase()]=0; });
let pointer = null;
cv.addEventListener('pointerdown', e=>{ pointer={x:e.clientX,y:e.clientY}; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e=>{ if(pointer) pointer={x:e.clientX,y:e.clientY}; });
cv.addEventListener('pointerup',   ()=>{ pointer=null; });
cv.addEventListener('pointercancel',()=>{ pointer=null; });

const intro = document.getElementById('intro');
intro.addEventListener('pointerdown', ()=>{ intro.remove(); ping(440,.08); ping(660,.08,.09); }, {once:true});

/* ---------- sound ---------- */
let audio=null, muted=false;
const soundBtn = document.getElementById('sound');
soundBtn.addEventListener('click', ()=>{ muted=!muted; soundBtn.textContent = muted?'🔇':'🔊'; });
function ping(freq, len, delay=0, type='square'){
  if(muted) return;
  try{
    audio = audio || new (window.AudioContext||window.webkitAudioContext)();
    const t = audio.currentTime + delay;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(.12, t);
    g.gain.exponentialRampToValueAtTime(.001, t+len);
    o.connect(g).connect(audio.destination);
    o.start(t); o.stop(t+len);
  }catch(e){}
}
function catchJingle(){ ping(523,.09); ping(784,.12,.08); }
function fanfare(){ [523,659,784,1047].forEach((f,i)=>ping(f,.12,i*.09)); }

/* ---------- toasts ---------- */
const toastEl = document.getElementById('toast');
let toastTimer=0;
const CATCH_TOASTS = ['Got ’em! 🐾','Zoomies!','Pup-tacular!','Gotcha, floof!','Tag! You’re it!'];
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 1200);
}

/* ---------- update ---------- */
function update(dt){
  // steer: keyboard beats touch when both are held
  let ix=0, iz=0;
  if(keys['arrowleft']||keys['a']) ix-=1;
  if(keys['arrowright']||keys['d']) ix+=1;
  if(keys['arrowup']||keys['w']) iz+=1;
  if(keys['arrowdown']||keys['s']) iz-=1;
  if(!ix && !iz && pointer){
    const anchorY = HORIZON + CAM_H/CAM_BACK*FOCAL;   // the cat's screen row
    const dx = pointer.x - W/2, dy = pointer.y - anchorY;
    const m = Math.hypot(dx,dy);
    if(m>18){ ix = dx/m; iz = -dy/m; }
  }
  // input is screen-relative: rotate it by the camera yaw into world space
  const im = Math.hypot(ix,iz)||1;
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const wx = (ix*cy + iz*sy)/im, wz = (-ix*sy + iz*cy)/im;
  const moving = (ix||iz) ? 1 : 0;
  cat.vx += (wx*CAT_SPEED*moving - cat.vx)*Math.min(1, dt*8);
  cat.vz += (wz*CAT_SPEED*moving - cat.vz)*Math.min(1, dt*8);
  if(!moving){ cat.vx*= (1-Math.min(1,dt*6)); cat.vz*=(1-Math.min(1,dt*6)); }
  cat.x = Math.max(-PARK, Math.min(PARK, cat.x + cat.vx*dt));
  cat.z = Math.max(-PARK, Math.min(PARK, cat.z + cat.vz*dt));
  cat.bob += dt * (4 + Math.hypot(cat.vx,cat.vz)*1.5);

  // camera swings behind the cat's direction of travel, then trails its position
  const spd = Math.hypot(cat.vx, cat.vz);
  if(spd > 1.5){
    const target = Math.atan2(cat.vx, cat.vz);
    const dy = ((target - yaw + Math.PI*3) % (Math.PI*2)) - Math.PI;
    yaw += dy * Math.min(1, dt*2.2);
  }
  cam.x += (cat.x - Math.sin(yaw)*CAM_BACK - cam.x)*Math.min(1, dt*5);
  cam.z += (cat.z - Math.cos(yaw)*CAM_BACK - cam.z)*Math.min(1, dt*5);

  for(const d of dogs){
    const ddx = d.x-cat.x, ddz = d.z-cat.z;
    const dist = Math.hypot(ddx,ddz);
    if(dist < CATCH_RADIUS){
      score++;
      document.getElementById('score').textContent = '🦴 ' + score;
      catchJingle();
      toast(CATCH_TOASTS[score % CATCH_TOASTS.length]);
      const ang = rnd(0,Math.PI*2), rd = rnd(16,26);
      d.x = Math.max(-PARK,Math.min(PARK, cat.x+Math.cos(ang)*rd));
      d.z = Math.max(-PARK,Math.min(PARK, cat.z+Math.sin(ang)*rd));
      if(score % 5 === 0){
        fanfare();
        if(dogs.length < MAX_DOGS){ spawnDog(); setTimeout(()=>toast('More pups incoming! 🐶'), 1300); }
        else setTimeout(()=>toast('Pup Parade! ⭐'), 1300);
      }
      continue;
    }
    if(dist < FLEE_RADIUS){
      d.vx += (ddx/dist*DOG_FLEE - d.vx)*Math.min(1,dt*6);
      d.vz += (ddz/dist*DOG_FLEE - d.vz)*Math.min(1,dt*6);
    }else{
      d.turn -= dt;
      if(d.turn<=0){ d.turn = rnd(0.8,2.2); d.wang = rnd(0,Math.PI*2); }
      d.vx += (Math.cos(d.wang)*DOG_WANDER - d.vx)*Math.min(1,dt*2);
      d.vz += (Math.sin(d.wang)*DOG_WANDER - d.vz)*Math.min(1,dt*2);
    }
    d.x += d.vx*dt; d.z += d.vz*dt;
    // bounce off the fence
    if(d.x<-PARK||d.x>PARK){ d.x=Math.max(-PARK,Math.min(PARK,d.x)); d.vx*=-1; d.wang=Math.PI-(d.wang||0); }
    if(d.z<-PARK||d.z>PARK){ d.z=Math.max(-PARK,Math.min(PARK,d.z)); d.vz*=-1; d.wang=-(d.wang||0); }
    d.bob += dt * (4 + Math.hypot(d.vx,d.vz)*1.5);
  }

  for(const c of clouds){ c.x += c.v*dt/W; if(c.x>1.15) c.x=-0.15; }
}

/* ---------- render ---------- */
function camSpace(x,z){
  const rx = x - cam.x, rz = z - cam.z;
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  return { crx: rx*cy - rz*sy, crz: rx*sy + rz*cy };
}
function project(x,z){
  const {crx, crz} = camSpace(x,z);
  if(crz < 0.3) return null;
  return {
    sx: W/2 + crx/crz * FOCAL,
    sy: HORIZON + CAM_H/crz * FOCAL,
    scale: FOCAL/crz,
    relz: crz
  };
}
function render(){
  // sky
  let g = cx2d.createLinearGradient(0,0,0,HORIZON);
  g.addColorStop(0,'#8ED4F0'); g.addColorStop(1,'#DFF4FB');
  cx2d.fillStyle = g; cx2d.fillRect(0,0,W,HORIZON);
  cx2d.font = '28px '+EMOJI_FONT; cx2d.textAlign='center'; cx2d.textBaseline='middle';
  for(const c of clouds){
    cx2d.font = c.s+'px '+EMOJI_FONT;
    cx2d.fillText('☁️', c.x*W, HORIZON*(c.y/0.25));
  }
  // lawn
  g = cx2d.createLinearGradient(0,HORIZON,0,H);
  g.addColorStop(0,'#9CD98B'); g.addColorStop(1,'#6FBF5C');
  cx2d.fillStyle = g; cx2d.fillRect(0,HORIZON,W,H-HORIZON);
  // haze band at the horizon for depth
  g = cx2d.createLinearGradient(0,HORIZON,0,HORIZON+H*0.08);
  g.addColorStop(0,'#DFF4FBcc'); g.addColorStop(1,'#DFF4FB00');
  cx2d.fillStyle = g; cx2d.fillRect(0,HORIZON,W,H*0.08);

  // billboards, far to near
  const items = [];
  for(const p of props) items.push(p);
  for(const d of dogs)  items.push(d);
  items.push(cat);
  const drawn = [];
  for(const it of items){
    const pr = project(it.x, it.z);
    if(!pr) continue;
    drawn.push({it, pr});
  }
  drawn.sort((A,B)=>B.pr.relz - A.pr.relz);
  for(const d of dogs) d.onScreen = false;
  for(const {it,pr} of drawn){
    const px = Math.min(pr.scale * it.size, H*0.6);
    if(px < 3 || pr.sx < -px || pr.sx > W+px) continue;
    if(it.onScreen !== undefined) it.onScreen = true;
    const hop = it.bob!==undefined ? Math.abs(Math.sin(it.bob*2))*px*0.10*(Math.hypot(it.vx||0,it.vz||0)>0.4?1:0.25) : 0;
    // grounding shadow
    cx2d.fillStyle = '#00000022';
    cx2d.beginPath();
    cx2d.ellipse(pr.sx, pr.sy, px*0.34, px*0.10, 0, 0, Math.PI*2);
    cx2d.fill();
    cx2d.font = px+'px '+EMOJI_FONT;
    cx2d.textAlign = 'center'; cx2d.textBaseline = 'alphabetic';
    // flip when moving right in CAMERA space — emoji critters face left by default
    const cvx = (it.vx||0)*Math.cos(yaw) - (it.vz||0)*Math.sin(yaw);
    cx2d.save();
    cx2d.translate(pr.sx, pr.sy + px*0.06 - hop);
    if(cvx > 0.3) cx2d.scale(-1,1);
    cx2d.fillText(it.emoji, 0, 0);
    cx2d.restore();
  }

  // edge bubbles pointing at off-screen pups, nearest three
  const hidden = dogs.filter(d=>!d.onScreen)
    .map(d=>({d, dist:Math.hypot(d.x-cat.x, d.z-cat.z)}))
    .sort((a,b)=>a.dist-b.dist).slice(0,3);
  let bi = 0;
  for(const {d} of hidden){
    const cs = camSpace(d.x, d.z);
    const a = Math.atan2(cs.crx, cs.crz);
    const vx = Math.sin(a), vy = -Math.cos(a);
    const RX = W/2 - 40, RY = H*0.33;
    const t = Math.min(RX/Math.max(1e-6,Math.abs(vx)), RY/Math.max(1e-6,Math.abs(vy)));
    const px = W/2 + vx*t, py = H*0.52 + vy*t;
    const r = 20 + Math.sin(tNow*5 + bi*2)*2;
    cx2d.fillStyle = '#FFF6E5';
    cx2d.strokeStyle = '#6B3F17'; cx2d.lineWidth = 3;
    cx2d.beginPath(); cx2d.arc(px, py, r, 0, Math.PI*2);
    cx2d.fill(); cx2d.stroke();
    cx2d.font = '20px '+EMOJI_FONT;
    cx2d.textAlign='center'; cx2d.textBaseline='middle';
    cx2d.fillText(d.emoji, px, py+1);
    bi++;
  }
}

/* ---------- main loop ---------- */
let last = performance.now(), tNow = 0;
function frame(now){
  // clamp below at 0: the first rAF timestamp can predate the `last` taken
  // at script load, and a negative dt lets NaN into the simulation
  const dt = Math.max(0, Math.min(0.05, (now-last)/1000));
  last = now; tNow = now/1000;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
