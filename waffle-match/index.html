<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Penelope's Waffle Match</title>
<meta name="description" content="A match-3 diner game: fill Penelope's waffle order before the syrup runs out. Cats, waffles, taxis, and the Big Apple.">
<meta name="theme-color" content="#8ED4F0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Waffle Match">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%87%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky1:#8ED4F0; --sky2:#C8ECF7;
    --taxi:#FFC93C; --syrup:#6B3F17; --waffle:#F2A65A;
    --cream:#FFF6E5; --coral:#FF7B54; --skyline:#2E5E8C;
    --mint:#5BC98F;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:'Nunito',sans-serif;
    background:linear-gradient(var(--sky1), var(--sky2) 70%);
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; overflow:hidden; touch-action:manipulation;
    user-select:none; -webkit-user-select:none;
  }
  header{ text-align:center; padding:10px 10px 2px; z-index:2; }
  h1{
    font-family:'Fredoka',sans-serif; font-weight:700;
    color:var(--syrup); font-size:clamp(1.3rem, 5.2vw, 2rem);
    text-shadow:0 2px 0 #fff8;
    letter-spacing:.5px;
  }
  h1 .drip{ color:var(--coral); }
  .hud{
    display:flex; align-items:center; gap:8px; justify-content:center;
    margin-top:6px; z-index:2; flex-wrap:wrap;
  }
  .badge{
    background:var(--taxi); color:var(--syrup);
    font-family:'Fredoka',sans-serif; font-weight:600;
    font-size:1.05rem; padding:5px 14px; border-radius:14px;
    border:3px solid var(--syrup); box-shadow:0 3px 0 var(--syrup);
    text-align:center;
  }
  .badge.level{ background:var(--cream); min-width:82px; }
  .score-badge{ min-width:96px; }
  .sound-btn{
    background:var(--cream); border:3px solid var(--syrup);
    border-radius:12px; font-size:1.05rem; padding:4px 10px;
    box-shadow:0 3px 0 var(--syrup); cursor:pointer;
  }
  .sound-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--syrup); }
  .sound-btn:focus-visible{ outline:3px solid var(--coral); outline-offset:2px; }

  /* Timer — a draining syrup bottle */
  .timer-row{
    display:flex; align-items:center; gap:8px; margin-top:8px; z-index:2;
    width:min(92vw, 440px);
  }
  .timer-row.hidden{ display:none; }
  .timer-icon{ font-size:1.3rem; }
  .timer-track{
    flex:1; height:16px; background:#fff;
    border:3px solid var(--syrup); border-radius:12px;
    box-shadow:0 3px 0 var(--syrup); overflow:hidden;
  }
  .timer-fill{
    height:100%; width:100%;
    background:linear-gradient(90deg, var(--waffle), var(--taxi));
    transition:width .12s linear;
  }
  .timer-fill.low{ background:var(--coral); }
  .timer-row.low .timer-icon{ animation:tick-pulse .5s ease infinite; }
  @keyframes tick-pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.25);} }
  .timer-secs{
    font-family:'Fredoka',sans-serif; font-weight:600; color:var(--syrup);
    min-width:36px; text-align:right; font-size:1rem;
  }

  /* Order ticket */
  .ticket{
    display:flex; align-items:center; gap:8px; margin-top:8px;
    background:var(--cream); border:3px dashed var(--syrup);
    border-radius:14px; padding:5px 12px; z-index:2;
    max-width:min(92vw, 440px); flex-wrap:wrap; justify-content:center;
  }
  .ticket-cat{ font-size:1.5rem; }
  .goals{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .goal{
    display:inline-flex; align-items:center; gap:4px;
    font-family:'Fredoka',sans-serif; font-weight:600; color:var(--syrup);
    font-size:1.05rem; padding:2px 8px; border-radius:10px;
    background:#fff; border:2px solid #0001;
  }
  .goal .g-emoji{ font-size:1.2rem; }
  .goal.done{ background:var(--mint); color:#fff; border-color:var(--mint); }
  .goal.bump{ animation:bump .3s ease; }
  @keyframes bump{ 0%,100%{ transform:scale(1);} 45%{ transform:scale(1.18);} }

  /* Board */
  #board-wrap{ position:relative; margin-top:10px; z-index:2; }
  #board{
    position:relative;
    background:var(--cream);
    border:4px solid var(--syrup);
    border-radius:20px;
    box-shadow:0 6px 0 var(--syrup), 0 14px 24px #0002;
    overflow:hidden;
  }
  .tile{
    position:absolute; top:0; left:0;
    display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--ts) * .62);
    width:var(--ts); height:var(--ts);
    border-radius:16px; cursor:pointer;
    transition:transform var(--fall) cubic-bezier(.34,1.4,.64,1), opacity var(--pop) ease, background .15s;
    will-change:transform;
  }
  .tile:hover{ background:#fff; }
  .tile.selected{
    background:var(--taxi);
    box-shadow:inset 0 0 0 3px var(--syrup);
    animation:wiggle .5s ease infinite;
  }
  @keyframes wiggle{ 0%,100%{rotate:-4deg;} 50%{rotate:4deg;} }
  .tile.popping{ transform:scale(0) rotate(20deg) !important; opacity:0; }
  .tile.nope{ animation:shake .3s ease; }
  @keyframes shake{ 0%,100%{translate:0;} 25%{translate:-5px 0;} 75%{translate:5px 0;} }

  /* Toast */
  #toast{
    position:absolute; left:50%; top:38%;
    transform:translate(-50%,-50%) scale(0);
    font-family:'Fredoka',sans-serif; font-weight:700;
    font-size:clamp(1.6rem, 7vw, 2.6rem);
    color:#fff; background:var(--coral);
    padding:10px 26px; border-radius:20px;
    border:4px solid var(--syrup); box-shadow:0 5px 0 var(--syrup);
    pointer-events:none; z-index:5; white-space:nowrap;
    transition:transform .25s cubic-bezier(.34,1.6,.64,1);
    rotate:-4deg;
  }
  #toast.show{ transform:translate(-50%,-50%) scale(1); }

  /* Floating "+3s" bonuses */
  .float-time{
    position:absolute; left:50%; top:8px; transform:translateX(-50%);
    font-family:'Fredoka',sans-serif; font-weight:700; font-size:1.4rem;
    color:var(--mint); text-shadow:0 2px 0 #fff, 0 0 6px #fff;
    pointer-events:none; z-index:6;
    animation:floatup 1s ease forwards;
  }
  @keyframes floatup{
    from{ opacity:1; transform:translate(-50%, 0); }
    to{ opacity:0; transform:translate(-50%, -34px); }
  }

  /* Overlay / cards */
  .overlay{
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    background:#2E5E8Ccc; backdrop-filter:blur(3px);
    padding:20px; opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .card{
    background:var(--cream); border:4px solid var(--syrup);
    border-radius:24px; box-shadow:0 8px 0 var(--syrup), 0 20px 40px #0004;
    padding:22px 24px; text-align:center; max-width:360px; width:100%;
    animation:pop-in .3s cubic-bezier(.34,1.5,.64,1);
  }
  @keyframes pop-in{ from{ transform:scale(.8); opacity:0;} to{ transform:scale(1); opacity:1;} }
  .card h2{
    font-family:'Fredoka',sans-serif; font-weight:700; color:var(--syrup);
    font-size:1.7rem; margin-bottom:6px;
  }
  .card p{ color:var(--syrup); font-size:1rem; margin-bottom:12px; line-height:1.4; }
  .card .big{ font-family:'Fredoka',sans-serif; font-size:2.4rem; color:var(--coral); }
  .card .stat{ font-family:'Fredoka',sans-serif; font-weight:600; font-size:1.1rem; color:var(--syrup); }
  .card .emoji-row{ font-size:2.2rem; margin-bottom:8px; }
  .btn{
    display:block; width:100%; margin-top:10px;
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:1.15rem;
    color:var(--syrup); background:var(--taxi);
    border:3px solid var(--syrup); border-radius:16px;
    box-shadow:0 4px 0 var(--syrup); padding:10px 14px; cursor:pointer;
  }
  .btn.secondary{ background:#fff; }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--syrup); }
  .btn:focus-visible{ outline:3px solid var(--coral); outline-offset:2px; }
  .btn small{ display:block; font-family:'Nunito',sans-serif; font-weight:600; font-size:.8rem; opacity:.75; }

  /* Skyline */
  .skyline{
    position:fixed; bottom:0; left:0; width:100%; z-index:0;
    pointer-events:none; line-height:0;
  }
  .skyline svg{ width:100%; height:auto; display:block; }
  .cloud{
    position:fixed; font-size:2rem; z-index:0; pointer-events:none;
    animation:drift linear infinite; opacity:.9;
  }
  @keyframes drift{ from{ transform:translateX(-10vw);} to{ transform:translateX(110vw);} }

  @media (prefers-reduced-motion: reduce){
    :root{ --fall:0s !important; --pop:0s !important; }
    .tile.selected{ animation:none; }
    .cloud{ animation:none; }
    #toast{ transition:none; }
    .card{ animation:none; }
    .timer-row.low .timer-icon{ animation:none; }
  }
</style>
</head>
<body>
<header>
  <h1>Penelope's <span class="drip">Waffle</span> Match</h1>
  <div class="hud">
    <div class="badge level">Level <span id="level">1</span></div>
    <div class="badge score-badge">🧇 <span id="score">0</span></div>
    <button class="sound-btn" id="soundBtn" aria-label="Toggle sound">🔊</button>
  </div>
  <div class="timer-row" id="timerRow">
    <span class="timer-icon" aria-hidden="true">🍯</span>
    <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
    <span class="timer-secs" id="timerSecs">90</span>
  </div>
  <div class="ticket" id="ticket" aria-label="Penelope's order">
    <span class="ticket-cat" id="ticketCat">🐱</span>
    <div class="goals" id="goals"></div>
  </div>
</header>

<div id="board-wrap">
  <div id="board" aria-label="Match the tiles"></div>
  <div id="toast"></div>
</div>

<span class="cloud" style="top:12%; animation-duration:60s;">☁️</span>
<span class="cloud" style="top:22%; animation-duration:85s; animation-delay:-30s;">☁️</span>

<div class="skyline" aria-hidden="true">
<svg viewBox="0 0 800 120" preserveAspectRatio="none">
  <g fill="#2E5E8C">
    <rect x="0" y="60" width="60" height="60"/>
    <rect x="70" y="40" width="45" height="80"/>
    <rect x="125" y="70" width="55" height="50"/>
    <rect x="190" y="30" width="40" height="90"/>
    <rect x="205" y="14" width="10" height="20"/>
    <rect x="240" y="55" width="60" height="65"/>
    <rect x="310" y="45" width="35" height="75"/>
    <rect x="355" y="25" width="30" height="95"/>
    <rect x="366" y="6" width="8" height="22"/>
    <rect x="395" y="65" width="70" height="55"/>
    <rect x="475" y="38" width="42" height="82"/>
    <rect x="527" y="58" width="58" height="62"/>
    <rect x="595" y="20" width="36" height="100"/>
    <rect x="608" y="2" width="9" height="20"/>
    <rect x="641" y="50" width="50" height="70"/>
    <rect x="700" y="66" width="45" height="54"/>
    <rect x="755" y="42" width="45" height="78"/>
  </g>
  <g fill="#FFC93C" opacity=".85">
    <rect x="15" y="72" width="6" height="6"/><rect x="34" y="86" width="6" height="6"/>
    <rect x="82" y="52" width="6" height="6"/><rect x="98" y="70" width="6" height="6"/>
    <rect x="200" y="44" width="6" height="6"/><rect x="214" y="62" width="6" height="6"/>
    <rect x="258" y="68" width="6" height="6"/><rect x="278" y="84" width="6" height="6"/>
    <rect x="362" y="40" width="6" height="6"/><rect x="371" y="58" width="6" height="6"/>
    <rect x="486" y="52" width="6" height="6"/><rect x="500" y="72" width="6" height="6"/>
    <rect x="604" y="34" width="6" height="6"/><rect x="616" y="55" width="6" height="6"/>
    <rect x="655" y="64" width="6" height="6"/><rect x="712" y="80" width="6" height="6"/>
  </g>
</svg>
</div>

<div class="overlay" id="overlay"><div class="card" id="card"></div></div>

<script>
(() => {
  const N = 7;
  const TYPES = ['🐱','🧇','🚕','🗽','🍎'];
  const MSGS4 = ['Purr-fect!','Waffle-y good!','Taxi! Taxi!','Meow-velous!'];
  const MSGS_CASCADE = ['Big Apple Bonus!','Syrup Shower!','Cat-tastic!','Wowza!'];
  const CATS = ['🐱','😺','😸','😻','🤩'];
  const BEST_KEY = 'waffleMatchBest';

  // Difficulty knobs -------------------------------------------------------
  const BASE_TIME   = 95;   // seconds on level 1
  const TIME_DROP   = 4;    // seconds less per level
  const MIN_TIME    = 55;   // never below this
  const ORDER_BASE  = 10;   // tiles to collect on level 1
  const ORDER_STEP  = 2;    // extra tiles per level
  const TIME_BONUS  = 1.5;  // seconds back per order tile matched
  const LEFTOVER_PT = 10;   // points per leftover second at level clear
  // ------------------------------------------------------------------------

  const board = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const toastEl = document.getElementById('toast');
  const goalsEl = document.getElementById('goals');
  const ticketCat = document.getElementById('ticketCat');
  const soundBtn = document.getElementById('soundBtn');
  const timerRow = document.getElementById('timerRow');
  const timerFill = document.getElementById('timerFill');
  const timerSecs = document.getElementById('timerSecs');
  const overlay = document.getElementById('overlay');
  const card = document.getElementById('card');
  const boardWrap = document.getElementById('board-wrap');

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FALL = reduced ? 0 : 260, POP = reduced ? 0 : 200, SWAP = reduced ? 0 : 160;
  document.documentElement.style.setProperty('--fall', FALL + 'ms');
  document.documentElement.style.setProperty('--pop', POP + 'ms');

  let TS = 56;               // tile size px
  let grid = [];             // grid[r][c] = tile object or null
  let score = 0;
  let selected = null, busy = false;
  let soundOn = true;

  // phase: 'menu' | 'playing' | 'timeup' | 'clear' | 'over'
  let phase = 'menu', timed = true;
  let level = 1, goals = [], timeLeft = 0, levelTime = 0;
  let timerId = null, lastTick = 0;

  // ---------- audio ----------
  let ctx = null;
  function beep(freq, dur = .09, type = 'sine', gain = .12){
    if (!soundOn) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(gain, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + dur);
    } catch(e){}
  }
  const popSound = lvl => beep(420 + lvl * 120, .12, 'triangle', .15);
  function fanfare(){
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .18, 'triangle', .13), i * 110));
  }
  function sadTrombone(){
    [392, 349, 311, 262].forEach((f, i) => setTimeout(() => beep(f, .22, 'sawtooth', .08), i * 150));
  }

  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊' : '🔇';
    if (soundOn) beep(660, .08);
  });

  // ---------- sizing ----------
  function size(){
    const w = Math.min(innerWidth * .92, 440);
    const maxH = innerHeight - board.getBoundingClientRect().top - 120;
    TS = Math.floor(Math.min(w, Math.max(maxH, 220)) / N);
    board.style.width  = TS * N + 'px';
    board.style.height = TS * N + 'px';
    document.documentElement.style.setProperty('--ts', TS + 'px');
    for (const row of grid) for (const t of row) if (t) place(t);
  }
  addEventListener('resize', size);

  function place(t){
    t.el.style.transform = `translate(${t.c * TS}px, ${t.r * TS}px)`;
  }

  // ---------- board setup ----------
  function randType(){ return TYPES[Math.floor(Math.random() * TYPES.length)]; }

  function makeTile(r, c, type){
    const el = document.createElement('div');
    el.className = 'tile';
    el.textContent = type;
    board.appendChild(el);
    const t = { r, c, type, el };
    el.addEventListener('pointerdown', () => onTap(t));
    place(t);
    return t;
  }

  function initBoard(){
    board.innerHTML = '';
    grid = Array.from({length:N}, () => Array(N).fill(null));
    for (let r = 0; r < N; r++){
      for (let c = 0; c < N; c++){
        let type;
        do { type = randType(); }
        while (
          (c >= 2 && grid[r][c-1]?.type === type && grid[r][c-2]?.type === type) ||
          (r >= 2 && grid[r-1][c]?.type === type && grid[r-2][c]?.type === type)
        );
        grid[r][c] = makeTile(r, c, type);
      }
    }
    if (!hasMove()) reshuffle(false);
  }

  // ---------- matching ----------
  function findMatches(){
    const hit = new Set();
    const scan = (getT, mark) => {
      for (let i = 0; i < N; i++){
        let run = 1;
        for (let j = 1; j <= N; j++){
          const same = j < N && getT(i, j) && getT(i, j - 1) && getT(i, j).type === getT(i, j - 1).type;
          if (same) run++;
          else {
            if (run >= 3) for (let k = j - run; k < j; k++) hit.add(mark(i, k));
            run = 1;
          }
        }
      }
    };
    scan((i,j) => grid[i][j], (i,k) => i + ',' + k);          // rows
    scan((i,j) => grid[j][i], (i,k) => k + ',' + i);          // cols
    return [...hit].map(s => s.split(',').map(Number));
  }

  function wouldMatchAt(r, c){
    const t = grid[r][c].type;
    const line = (dr, dc) => {
      let n = 1;
      for (const s of [-1, 1]){
        let rr = r + dr * s, cc = c + dc * s;
        while (rr >= 0 && rr < N && cc >= 0 && cc < N && grid[rr][cc]?.type === t){
          n++; rr += dr * s; cc += dc * s;
        }
      }
      return n;
    };
    return line(0,1) >= 3 || line(1,0) >= 3;
  }

  function hasMove(){
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){
      for (const [dr, dc] of [[0,1],[1,0]]){
        const r2 = r + dr, c2 = c + dc;
        if (r2 >= N || c2 >= N) continue;
        swapCells(r, c, r2, c2);
        const ok = wouldMatchAt(r, c) || wouldMatchAt(r2, c2);
        swapCells(r, c, r2, c2);
        if (ok) return true;
      }
    }
    return false;
  }

  function swapCells(r1, c1, r2, c2){
    const a = grid[r1][c1], b = grid[r2][c2];
    grid[r1][c1] = b; grid[r2][c2] = a;
    if (a){ a.r = r2; a.c = c2; }
    if (b){ b.r = r1; b.c = c1; }
  }

  // ---------- interaction ----------
  function onTap(t){
    if (busy || phase !== 'playing') return;
    if (!selected){
      selected = t; t.el.classList.add('selected'); beep(520, .06);
      return;
    }
    if (selected === t){
      t.el.classList.remove('selected'); selected = null;
      return;
    }
    const adj = Math.abs(selected.r - t.r) + Math.abs(selected.c - t.c) === 1;
    if (!adj){
      selected.el.classList.remove('selected');
      selected = t; t.el.classList.add('selected'); beep(520, .06);
      return;
    }
    const a = selected;
    a.el.classList.remove('selected'); selected = null;
    trySwap(a, t);
  }

  const sleep = ms => new Promise(res => setTimeout(res, ms));

  async function trySwap(a, b){
    busy = true;
    swapCells(a.r, a.c, b.r, b.c);
    place(a); place(b);
    await sleep(SWAP + 40);
    if (findMatches().length){
      await resolve();
    } else {
      swapCells(a.r, a.c, b.r, b.c);
      place(a); place(b);
      a.el.classList.add('nope'); b.el.classList.add('nope');
      beep(180, .12, 'square', .08);
      await sleep(320);
      a.el.classList.remove('nope'); b.el.classList.remove('nope');
    }
    busy = false;
    // The buzzer may have gone off mid-cascade — settle up now that the board is still.
    if (phase === 'timeup') finishRound();
    else if (phase === 'playing' && orderDone()) levelClear();
  }

  // ---------- resolution ----------
  async function resolve(){
    let cascade = 0;
    while (true){
      const matches = findMatches();
      if (!matches.length) break;
      cascade++;
      popSound(cascade);

      addScore(matches.length * 10 * cascade);
      creditOrder(matches.map(([r, c]) => grid[r][c].type));
      if (matches.length >= 4 && cascade === 1) showToast(pick(MSGS4));
      if (cascade >= 2) showToast(pick(MSGS_CASCADE));

      for (const [r, c] of matches){
        const t = grid[r][c];
        grid[r][c] = null;
        t.el.classList.add('popping');
        setTimeout(() => t.el.remove(), POP + 50);
      }
      await sleep(POP + 60);

      // gravity + refill
      for (let c = 0; c < N; c++){
        let write = N - 1;
        for (let r = N - 1; r >= 0; r--){
          if (grid[r][c]){
            if (r !== write){
              grid[write][c] = grid[r][c];
              grid[r][c] = null;
              grid[write][c].r = write;
              place(grid[write][c]);
            }
            write--;
          }
        }
        let spawn = 1;
        for (let r = write; r >= 0; r--){
          const t = makeTile(r, c, randType());
          t.el.style.transition = 'none';
          t.el.style.transform = `translate(${c * TS}px, ${-spawn++ * TS}px)`;
          grid[r][c] = t;
          requestAnimationFrame(() => requestAnimationFrame(() => {
            t.el.style.transition = '';
            place(t);
          }));
        }
      }
      await sleep(FALL + 80);
    }
    if (!hasMove()){
      showToast('Fresh waffles! 🧇');
      await sleep(700);
      reshuffle(true);
    }
  }

  function reshuffle(animated){
    const tiles = grid.flat();
    do {
      for (let i = tiles.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [tiles[i].type, tiles[j].type] = [tiles[j].type, tiles[i].type];
      }
      for (const t of tiles) t.el.textContent = t.type;
    } while (findMatches().length || !hasMove());
    if (animated) beep(700, .15);
  }

  // ---------- the order ----------
  function planLevel(lv){
    const nGoals = lv < 3 ? 1 : lv < 6 ? 2 : 3;
    const total = ORDER_BASE + lv * ORDER_STEP;
    const need = Math.max(5, Math.round(total / nGoals));
    const shuffled = [...TYPES].sort(() => Math.random() - .5);
    return {
      goals: shuffled.slice(0, nGoals).map(type => ({ type, need, got: 0, el: null })),
      time: Math.max(MIN_TIME, BASE_TIME - (lv - 1) * TIME_DROP),
    };
  }

  function renderOrder(){
    goalsEl.innerHTML = '';
    for (const g of goals){
      const el = document.createElement('span');
      el.className = 'goal';
      el.innerHTML = `<span class="g-emoji">${g.type}</span><span class="g-count"></span>`;
      goalsEl.appendChild(el);
      g.el = el;
      paintGoal(g);
    }
    updateTicketCat();
  }

  function paintGoal(g){
    const done = g.got >= g.need;
    g.el.querySelector('.g-count').textContent = done ? '✓' : `${g.got}/${g.need}`;
    g.el.classList.toggle('done', done);
  }

  function updateTicketCat(){
    const pct = goals.length
      ? goals.reduce((a, g) => a + Math.min(g.got / g.need, 1), 0) / goals.length
      : 0;
    ticketCat.textContent = CATS[Math.min(Math.floor(pct * CATS.length), CATS.length - 1)];
  }

  function creditOrder(types){
    let gained = 0;
    for (const type of types){
      const g = goals.find(g => g.type === type && g.got < g.need);
      if (!g) continue;
      g.got++;
      gained++;
      g.el.classList.remove('bump');
      void g.el.offsetWidth;
      g.el.classList.add('bump');
      paintGoal(g);
      if (g.got >= g.need) beep(1046, .18, 'triangle', .14);   // that item is checked off
    }
    if (!gained) return;
    updateTicketCat();
    if (timed && phase === 'playing'){
      const bonus = gained * TIME_BONUS;
      timeLeft = Math.min(timeLeft + bonus * 1000, levelTime * 1000);
      renderTimer();
      floatTime('+' + (Math.round(bonus * 10) / 10) + 's');
    }
  }

  const orderDone = () => goals.length > 0 && goals.every(g => g.got >= g.need);

  function floatTime(text){
    const el = document.createElement('div');
    el.className = 'float-time';
    el.textContent = text;
    boardWrap.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }

  // ---------- timer ----------
  function renderTimer(){
    const secs = Math.ceil(timeLeft / 1000);
    timerSecs.textContent = secs;
    const pct = Math.max(0, Math.min(1, timeLeft / (levelTime * 1000)));
    timerFill.style.width = (pct * 100) + '%';
    const low = secs <= 10;
    timerFill.classList.toggle('low', low);
    timerRow.classList.toggle('low', low);
  }

  function startTimer(){
    stopTimer();
    lastTick = performance.now();
    timerId = setInterval(tick, 100);
  }
  function stopTimer(){
    if (timerId) clearInterval(timerId);
    timerId = null;
  }
  function tick(){
    const now = performance.now();
    const dt = now - lastTick;
    lastTick = now;
    if (phase !== 'playing' || document.hidden) return;   // pause when backgrounded
    timeLeft -= dt;
    if (timeLeft <= 0){
      timeLeft = 0;
      renderTimer();
      stopTimer();
      phase = 'timeup';
      if (selected){ selected.el.classList.remove('selected'); selected = null; }
      if (!busy) finishRound();                            // otherwise trySwap settles up
      return;
    }
    renderTimer();
  }

  // ---------- flow ----------
  function startGame(isTimed){
    timed = isTimed;
    timerRow.classList.toggle('hidden', !timed);
    score = 0; scoreEl.textContent = 0;
    level = 1;
    initBoard();
    size();
    startLevel();
  }

  function startLevel(){
    const plan = planLevel(level);
    goals = plan.goals;
    levelTime = plan.time;
    timeLeft = plan.time * 1000;
    levelEl.textContent = level;
    renderOrder();
    renderTimer();
    hideOverlay();
    phase = 'playing';
    if (timed) startTimer(); else stopTimer();
  }

  function levelClear(){
    stopTimer();
    phase = 'clear';
    if (selected){ selected.el.classList.remove('selected'); selected = null; }
    const leftover = timed ? Math.floor(timeLeft / 1000) : 0;
    if (leftover) addScore(leftover * LEFTOVER_PT);
    showToast('Order up! 🧇');
    fanfare();
    setTimeout(() => {
      showCard(`
        <div class="emoji-row">🧇✨🐱</div>
        <h2>Order up!</h2>
        <p>Level ${level} served.${leftover ? ` <span class="stat">+${leftover * LEFTOVER_PT}</span> for ${leftover}s of syrup left.` : ''}</p>
        <p class="stat">Score ${score}</p>
      `, [
        { label: 'Next order', sub: `Level ${level + 1}`, action: () => { level++; startLevel(); } },
      ]);
    }, 900);
  }

  function finishRound(){
    if (orderDone()) { levelClear(); return; }   // a last-second cascade still counts
    gameOver();
  }

  function gameOver(){
    stopTimer();
    phase = 'over';
    if (selected){ selected.el.classList.remove('selected'); selected = null; }
    sadTrombone();
    const best = Math.max(score, +(localStorage.getItem(BEST_KEY) || 0));
    try { localStorage.setItem(BEST_KEY, best); } catch(e){}
    const isBest = score >= best && score > 0;
    showCard(`
      <div class="emoji-row">🍯😿</div>
      <h2>Out of syrup!</h2>
      <p>You served <span class="stat">${level - 1}</span> order${level - 1 === 1 ? '' : 's'}.</p>
      <div class="big">${score}</div>
      <p class="stat">${isBest ? '🏆 New best!' : best ? 'Best ' + best : ''}</p>
    `, [
      { label: 'Cook again', sub: 'Waffle Rush', action: () => startGame(true) },
      { label: 'Cozy mode', sub: 'No timer, no losing', action: () => startGame(false), secondary: true },
    ]);
  }

  function showMenu(){
    phase = 'menu';
    const best = +(localStorage.getItem(BEST_KEY) || 0);
    showCard(`
      <div class="emoji-row">🐱🧇🚕🗽🍎</div>
      <h2>Penelope's Waffle Match</h2>
      <p>Swap two neighbors to line up three. Fill the order on the ticket before the syrup runs out — every order tile you match pours a little syrup back.</p>
      ${best ? `<p class="stat">Best ${best}</p>` : ''}
    `, [
      { label: 'Waffle Rush', sub: 'Beat the timer', action: () => startGame(true) },
      { label: 'Cozy mode', sub: 'No timer, no losing', action: () => startGame(false), secondary: true },
    ]);
  }

  function showCard(html, buttons){
    card.innerHTML = html;
    for (const b of buttons){
      const btn = document.createElement('button');
      btn.className = 'btn' + (b.secondary ? ' secondary' : '');
      btn.innerHTML = b.label + (b.sub ? `<small>${b.sub}</small>` : '');
      btn.addEventListener('click', () => { beep(760, .1); b.action(); });
      card.appendChild(btn);
    }
    overlay.classList.add('show');
  }
  function hideOverlay(){ overlay.classList.remove('show'); }

  // ---------- score, toast ----------
  function addScore(n){
    score += n;
    scoreEl.textContent = score;
  }

  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  let toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1100);
  }

  // Don't burn the clock while the tab is hidden.
  document.addEventListener('visibilitychange', () => { lastTick = performance.now(); });

  // ---------- go ----------
  initBoard();
  size();
  showMenu();
})();
</script>
</body>
