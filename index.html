<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Arcade</title>
<meta name="description" content="Vibe coded games. Pick one and play.">
<meta name="theme-color" content="#8ED4F0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%95%B9%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky1:#8ED4F0; --sky2:#C8ECF7;
    --taxi:#FFC93C; --syrup:#6B3F17;
    --cream:#FFF6E5; --coral:#FF7B54;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body{
    font-family:'Nunito',sans-serif;
    background:linear-gradient(var(--sky1), var(--sky2) 70%);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:28px 16px 40px;
  }
  h1{
    font-family:'Fredoka',sans-serif; font-weight:700;
    color:var(--syrup); font-size:clamp(2rem, 8vw, 3rem);
    text-shadow:0 2px 0 #fff8; letter-spacing:1px;
  }
  h1 .blink{ color:var(--coral); }
  .tagline{
    color:var(--syrup); font-weight:800; opacity:.75;
    margin-top:4px; font-size:clamp(.9rem, 3.5vw, 1.05rem);
  }
  .games{
    list-style:none; width:100%; max-width:520px;
    margin-top:28px; display:flex; flex-direction:column; gap:18px;
  }
  .game-card{
    display:flex; align-items:center; gap:16px;
    background:var(--cream); text-decoration:none;
    border:4px solid var(--syrup); border-radius:20px;
    box-shadow:0 6px 0 var(--syrup), 0 14px 24px #0002;
    padding:16px 20px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .game-card:hover{ transform:translateY(-3px); box-shadow:0 9px 0 var(--syrup), 0 18px 28px #0002; }
  .game-card:active{ transform:translateY(3px); box-shadow:0 3px 0 var(--syrup), 0 8px 16px #0002; }
  .game-card:focus-visible{ outline:4px solid var(--coral); outline-offset:3px; }
  .game-icon{
    font-size:2.6rem; line-height:1;
    background:var(--taxi); border:3px solid var(--syrup);
    border-radius:14px; padding:10px; flex-shrink:0;
  }
  .game-name{
    font-family:'Fredoka',sans-serif; font-weight:600;
    color:var(--syrup); font-size:1.25rem;
  }
  .game-desc{ color:var(--syrup); opacity:.8; font-weight:600; font-size:.95rem; margin-top:2px; }
  .soon{
    border-style:dashed; opacity:.55; box-shadow:none;
    justify-content:center; padding:20px;
    color:var(--syrup); font-weight:800; font-size:.95rem;
  }
  footer{ margin-top:auto; padding-top:36px; }
  footer a{ color:var(--syrup); font-weight:800; font-size:.85rem; opacity:.6; }
  footer a:hover{ opacity:1; }
</style>
</head>
<body>
<h1>🕹️ Arcade<span class="blink">.</span></h1>
<p class="tagline">Vibe coded games. Pick one and play.</p>

<ul class="games">
  <li>
    <a class="game-card" href="waffle-match/">
      <span class="game-icon" aria-hidden="true">🧇</span>
      <span>
        <span class="game-name">Penelope's Waffle Match</span><br>
        <span class="game-desc">A cozy match-3. No timer, no losing. 🐱🚕🗽🍎</span>
      </span>
    </a>
  </li>
  <li class="game-card soon">more games cooking&hellip;</li>
</ul>

<footer><a href="https://github.com/5x5x5x5/arcade">source on GitHub</a></footer>
</body>
</html>
